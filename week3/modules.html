<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="BYU-Idaho Course Enrollment - ES Modules practice">
    <meta name="author" content="Enias Gramu">
    <title>Course Enrollment - ES Modules</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Open+Sans:wght@400;600&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="styles/modules.css">
</head>

<body>
    <main>
        <h1 id="course-title"></h1>

        <section class="enrollment-controls">
            <label for="sectionNumber">Select Section:</label>
            <select id="sectionNumber"></select>

            <button id="enrollStudent">Enroll Student (+1)</button>
            <button id="dropStudent">Drop Student (−1)</button>
        </section>

        <section class="sections-container">
            <h2>Section Enrollment</h2>
            <div id="sections-list"></div>
        </section>
    </main>

    <!-- Module script — no defer needed with type="module" -->
    <script type="module" src="scripts/modules.mjs"></script>
</body>

</html>
